[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo6g"
version = "0.1.0"
description = "A network buyer workspace powered by a native C++ scenario model."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Abhinav"}]
dependencies = []

[project.scripts]
echo6g = "echo6g.cli:main"
echo6g-web = "echo6g.web:main"

[tool.setuptools.packages.find]
include = ["echo6g*"]

[tool.setuptools.package-data]
echo6g = ["static/*", "native/*.cpp", "native/*.hpp"]
