<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">Network scenario comparison</title>
  <desc id="desc">A radio network connects several services to a simple comparison dashboard.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e8f4f2"/>
      <stop offset="1" stop-color="#f4f6f8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fbfb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#294b55" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="704" height="484" rx="36" fill="url(#backdrop)"/>
  <circle cx="170" cy="245" r="142" fill="#d8ece8" opacity=".7"/>
  <circle cx="170" cy="245" r="106" fill="none" stroke="#b5d9d3" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="170" cy="245" r="70" fill="none" stroke="#a4cec8" stroke-width="1.5" stroke-dasharray="4 8"/>

  <g fill="none" stroke="#69aaa1" stroke-linecap="round" stroke-width="3">
    <path d="M170 221 C236 156 294 148 380 164"/>
    <path d="M170 237 C245 221 286 230 380 236"/>
    <path d="M170 253 C242 290 295 315 380 310"/>
  </g>
  <g fill="#fff" stroke="#168984" stroke-width="3">
    <circle cx="260" cy="160" r="7"/>
    <circle cx="294" cy="225" r="7"/>
    <circle cx="283" cy="295" r="7"/>
  </g>

  <g stroke="#137f7b" stroke-linecap="round" stroke-linejoin="round">
    <path d="m130 354 40-145 40 145M144 305h52M151 278h38M157 252h26M163 226h14" fill="none" stroke-width="7"/>
    <path d="M170 209v-20m-16 5c7-9 25-9 32 0m-42-13c13-15 39-15 52 0" fill="none" stroke-width="4"/>
    <path d="M119 354h102" fill="none" stroke-width="7"/>
  </g>
  <circle cx="170" cy="245" r="11" fill="#168984" stroke="#fff" stroke-width="4"/>
  <g fill="#fff" stroke="#c6dcd9" stroke-width="1.5">
    <rect x="79" y="113" width="84" height="37" rx="12"/>
    <rect x="177" y="382" width="90" height="37" rx="12"/>
    <rect x="68" y="292" width="45" height="38" rx="12"/>
  </g>
  <g fill="#168984">
    <path d="M96 125h21v14H96zM101 120h11v5h-11z"/>
    <path d="M194 393h22v16h-22zM198 389h14v4h-14z"/>
    <circle cx="91" cy="311" r="7"/><path d="M79 325c2-8 22-8 24 0"/>
  </g>
  <g fill="#89bcb5">
    <circle cx="126" cy="127" r="2"/><circle cx="135" cy="127" r="2"/>
    <circle cx="229" cy="400" r="2"/><circle cx="238" cy="400" r="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="368" y="70" width="275" height="359" rx="22" fill="url(#card)" stroke="#d9e6e5"/>
  </g>
  <text x="394" y="111" fill="#74858d" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SCENARIO REVIEW</text>
  <text x="394" y="143" fill="#193243" font-family="Arial, sans-serif" font-size="19" font-weight="700">Service fit</text>
  <rect x="394" y="163" width="221" height="1" fill="#e5ecec"/>
  <g font-family="Arial, sans-serif">
    <text x="394" y="194" fill="#6c7d85" font-size="11">Delay target</text>
    <text x="615" y="194" text-anchor="end" fill="#193243" font-size="12" font-weight="700">30 ms</text>
    <text x="394" y="225" fill="#6c7d85" font-size="11">Reliability target</text>
    <text x="615" y="225" text-anchor="end" fill="#193243" font-size="12" font-weight="700">95%</text>
  </g>
  <rect x="394" y="246" width="221" height="1" fill="#e5ecec"/>
  <text x="394" y="276" fill="#74858d" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">RESOURCE STRATEGIES</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#344c58">
    <text x="410" y="310">Energy saver</text><text x="410" y="344">Fixed middle</text>
    <text x="410" y="378">Performance first</text>
  </g>
  <g>
    <circle cx="398" cy="306" r="4" fill="#79b8a0"/>
    <circle cx="398" cy="340" r="4" fill="#dfb079"/>
    <circle cx="398" cy="374" r="4" fill="#65aaa4"/>
    <rect x="546" y="296" width="69" height="19" rx="9.5" fill="#e9f4ef"/>
    <rect x="546" y="330" width="69" height="19" rx="9.5" fill="#f7f0e8"/>
    <rect x="546" y="364" width="69" height="19" rx="9.5" fill="#e8f3f2"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
    <text x="580" y="309" fill="#34775e">LOWER ENERGY</text>
    <text x="580" y="343" fill="#9a7146">FIXED LEVEL</text>
    <text x="580" y="377" fill="#267c78">MORE CAPACITY</text>
  </g>
  <path d="M394 402h221" stroke="#e5ecec"/>
  <circle cx="401" cy="415" r="4" fill="#d39a5c"/>
  <text x="412" y="419" fill="#778891" font-family="Arial, sans-serif" font-size="9">Illustrative model only</text>
</svg>
